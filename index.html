<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Car Owner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background-color: #f4f4f4;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      text-transform: uppercase;
      color: #000;
      margin-bottom: 10px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .details {
      margin-bottom: 30px;
    }

    .details p {
      font-size: 18px;
      margin: 6px 0;
      color: #555;
    }

    .button {
      display: block;
      width: 90%;
      max-width: 300px;
      margin: 20px auto;
      padding: 18px;
      font-size: 18px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.3s;
    }

    .button:hover {
      background-color: #0056b3;
    }

    .button.emergency {
      background-color: #dc3545;
    }

    .button.emergency:hover {
      background-color: #a71d2a;
    }
  
.scba-top{

    font-size:32px;

    font-weight:800;

    color:#0b1f3a;

    line-height:1.15;

    margin-bottom:15px;

    text-transform:uppercase;

}
.logo{

    font-size:48px;

    margin-bottom:10px;

}

.title{

    font-size:24px;

    font-weight:800;

    color:#0b1f3a;

    margin-bottom:8px;

    white-space:nowrap;

}

.subtitle{

    font-size:18px;

    color:#b8860b;

    font-weight:800;

    margin-bottom:25px;

    text-transform:uppercase;

}

.notice{

    color:#444;

    font-size:16px;

    font-weight:600;

    max-width:450px;

    margin:15px auto 25px;

    line-height:1.5;

}

.details p{

    font-size:18px;

    font-weight:700;

}

.profile{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:10px;
}

.profile-pic{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:25px;
    border:none;
    box-shadow:0 3px 10px rgba(0,0,0,0.15);
}

@media (max-width:480px){
    .profile-pic{
        width:140px;
        height:140px;
    }

    .title{
        font-size:18px;
        white-space:normal;
    }
}
  </style>
</head>
<body>

<div class="scba-top">
SUPREME COURT BAR ASSOCIATION
</div>

<div class="logo">⚖️</div>

<div class="profile">
    <img src="Advocate-Author-Nikhil-Chugh.webp" alt="Advocate Nikhil Chugh" class="profile-pic">
    <div class="title">ADVOCATE NIKHIL CHUGH</div>
</div>
  
<div class="subtitle">
MEMBER
</div>

<p class="notice">
Vehicle Blocked • Accident • Vehicle Damage • Medical Emergency

<br><br>

Please use the buttons below for immediate assistance.
</p>
  
  <div class="details">
   <p><strong>BLOOD GROUP:</strong> O+VE</p>
  </div>

  <a class="button" href="tel:9138400890">📞 Call the Owner</a>
  <a class="button emergency" href="tel:9416019830">🚨 Call for Emergency</a>

</body>
</html>
